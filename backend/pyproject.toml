[project]
name = "budgetmate-api"
version = "1.0.0"
description = "BudgetMate FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.5.0",
  "asyncpg>=0.29.0",
  "motor>=3.6.0",
  "redis>=5.0.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "bcrypt>=4.1.0",
  "passlib>=1.7.4",
  "aiosqlite>=0.19.0"
]
