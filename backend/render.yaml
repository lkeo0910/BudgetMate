services:
  - type: web
    name: budgetmate-api
    env: python
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
