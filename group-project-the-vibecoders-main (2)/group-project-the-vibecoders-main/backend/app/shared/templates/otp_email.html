<!DOCTYPE html>
<html>
<head>
    <style>
        .container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #ffffff;
        }
        .header {
            text-align: center;
            padding-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            text-decoration: none;
        }
        .content {
            text-align: center;
            color: #374151;
        }
        .otp-container {
            background-color: #f3f4f6;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #111827;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            margin-top: 20px;
        }
        .expiry {
            font-size: 14px;
            color: #ef4444;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="#" class="logo">BudgetMate</a>
        </div>
        <div class="content">
            <h2>Verify your email address</h2>
            <p>Thanks for joining BudgetMate! Use the following code to complete your registration:</p>
            <div class="otp-container">
                $otp_code
            </div>
            <p class="expiry">This code will expire in 5 minutes.</p>
            <p>If you didn't request this code, you can safely ignore this email.</p>
        </div>
        <div class="footer">
            &copy; 2026 BudgetMate. All rights reserved.
        </div>
    </div>
</body>
</html>
